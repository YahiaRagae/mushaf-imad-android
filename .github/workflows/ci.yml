name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sample-freeze check needs a merge base with
          # the PR base branch (three-dot diff fails on shallow clones)
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The sample app is the public-API compatibility oracle: it must build
      # against the libraries without any source changes. Fail fast if a PR
      # modifies it.
      - name: Verify sample app sources are unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- sample/src)
          if [ -n "$changed" ]; then
            echo "::error::sample/src was modified. The sample app is frozen as the API-compatibility oracle."
            echo "$changed"
            exit 1
          fi

      - name: Public API check (binary-compatibility-validator)
        run: ./gradlew apiCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build sample (debug + minified release)
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease -x lint

      - name: Publish to Maven local (JitPack dry run)
        run: ./gradlew :mushaf-core:publishToMavenLocal :mushaf-ui:publishToMavenLocal -x lint

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
